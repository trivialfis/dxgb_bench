name: dxgb_bench

on: [push]

permissions:
  contents: read # to fetch code (actions/checkout)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and Lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install packages
      run: |
        python3 -m pip install ruff
    - name: Run lint
      run: |
        ruff check .
        ruff format --check .

  tests:
    name: Run basic tests
    env:
      CONDA_OVERRIDE_CUDA: "13.2"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false
        fetch-depth: 0 # hatch-vcs needs tags and history to calculate the version.
    - uses: prefix-dev/setup-pixi@v0.9.5
      with:
        pixi-version: v0.77.0
        environments: dev
    - name: System dependencies
      run: |
        sudo apt install numactl -y
    - name: Install XGBoost
      run: |
        pixi run --environment dev pip install xgboost
    - name: Build wheel with pip isolation
      run: |
        pixi run --environment dev pip wheel . --no-deps --wheel-dir dist \
          --config-settings=cmake.args="-DCMAKE_BUILD_TYPE=RelWithDebInfo"
    - name: Build
      run: |
        pixi run --environment dev build
        pixi run --environment dev dxgb-bench --version
    - name: Test
      run: |
        pixi run --environment dev pytest -s -v ./tests/*.py
